<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Système de Design de l'État pagination demonstrating the default variant.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination (default)</title>
<script type="application/json" id="dsfr-agent-meta">
{
  "_schemaVersion": 2,
  "discovery": {
    "dsfrComponentType": "pagination",
    "frClass": "fr-pagination",
    "section": "navigation",
    "variant": "default",
    "requiresJs": "no",
    "interaction": [
      "click",
      "focus"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "RGAA 4.1",
      "WCAG 2.1 AA",
      "Directive (UE) 2016/2102"
    ],
    "tier": "curated",
    "tags": [
      "pagination",
      "pages",
      "results"
    ],
    "description": "Numbered pagination with first/prev/next/last controls.",
    "compliance": {
      "nistControls": [],
      "rgaa": true,
      "wcag21AA": true,
      "webAccessibilityDirective": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    }
  },
  "selection": {
    "useWhen": [
      "Paginated result lists",
      "Sequential content pages"
    ],
    "avoidWhen": [
      "Question flows — use buttons instead"
    ]
  },
  "instruction": {
    "agentPrompt": "Edit page links. aria-current='page' on the active page. First/last/prev/next need their modifier classes and accessible labels.",
    "relatedComponents": [
      "table",
      "search"
    ]
  },
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "cheap",
      "estimatedTokens": 228,
      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "compositionRecipes": [
      "search-results"
    ]
  },
  "constraints": {
    "preserve": [
      "nav[role='navigation'] with aria-label='Pagination'",
      "aria-current='page' on the active page",
      "Modifier classes on first/prev/next/last links"
    ],
    "editable": [
      "Page numbers",
      "hrefs",
      "First/last labels"
    ],
    "limitations": [
      "Keep total page count honest — no dead links"
    ],
    "portableInvariants": [
      "Pagination landmark labelled"
    ]
  },
  "supportedTokenProfiles": [
    "highContrast"
  ],
  "file": "pagination/default.html",
  "title": "Pagination (default)"
}
</script>
<style>
body{font-family:'Marianne',Arial,Helvetica,sans-serif;font-size:1rem;line-height:1.5rem;color:#161616;padding:2rem;background:#fff;margin:0}
.cap{position:fixed;bottom:12px;left:16px;font-size:11px;letter-spacing:.08em;color:#666;text-transform:uppercase}
a{color:#000091}
:focus-visible{outline:2px solid #0a76f6;outline-offset:2px}
.govuk-visually-hidden,.fr-visually-hidden{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.fr-label{display:block;font-weight:500;font-size:.875rem;line-height:1.5rem;color:#161616}
.fr-hint-text{display:block;font-weight:400;font-size:.75rem;line-height:1.25rem;color:#666;margin-top:0}
.fr-error-text{display:block;font-weight:500;font-size:.75rem;line-height:1.5rem;color:#ce0500;margin-top:4px}
.fr-valid-text{display:block;font-weight:500;font-size:.75rem;line-height:1.5rem;color:#18753c;margin-top:4px}
.fr-text--lg{font-size:1.25rem;line-height:2rem}
.fr-text--sm,.fr-callout p{font-size:.875rem;line-height:1.5rem}

.fr-pagination__list{list-style:none;margin:1rem 0;padding:0;display:flex;flex-wrap:wrap;gap:.25rem}
.fr-pagination__link{display:inline-block;padding:.25rem .5rem;color:#000091;text-decoration:underline;border:1px solid transparent}
.fr-pagination__link[aria-current=page]{background:#000091;color:#fff;text-decoration:none;font-weight:700}
.fr-pagination__link--first,.fr-pagination__link--prev,.fr-pagination__link--next,.fr-pagination__link--last{color:#000091}

</style>
</head>
<body>
<nav role="navigation" class="fr-pagination" aria-label="Pagination">
  <ul class="fr-pagination__list">
    <li>
      <a class="fr-pagination__link fr-pagination__link--first" href="#" title="Première page">
        Première page
      </a>
    </li>
    <li>
      <a class="fr-pagination__link fr-pagination__link--prev fr-pagination__link--lg-label" href="#" title="Page précédente">
        Page précédente
      </a>
    </li>
    <li>
      <a class="fr-pagination__link" aria-current="page" href="#" title="Page 1">1</a>
    </li>
    <li>
      <a class="fr-pagination__link" href="#" title="Page 2">2</a>
    </li>
    <li>
      <a class="fr-pagination__link" href="#" title="Page 3">3</a>
    </li>
    <li>
      <a class="fr-pagination__link fr-pagination__link--next fr-pagination__link--lg-label" href="#" title="Page suivante">
        Page suivante
      </a>
    </li>
  </ul>
</nav>
<div class="cap">pagination default</div>
</body>
</html>
