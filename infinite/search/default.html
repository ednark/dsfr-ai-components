<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Système de Design de l'État search bar demonstrating the default variant.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search bar (default)</title>
<script type="application/json" id="dsfr-agent-meta">
{
  "_schemaVersion": 2,
  "discovery": {
    "dsfrComponentType": "search",
    "frClass": "fr-search-bar",
    "section": "forms",
    "variant": "default",
    "requiresJs": "no",
    "interaction": [
      "type",
      "focus",
      "click"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "RGAA 4.1",
      "WCAG 2.1 AA",
      "Directive (UE) 2016/2102"
    ],
    "tier": "curated",
    "tags": [
      "search",
      "recherche",
      "query"
    ],
    "description": "Search bar with hidden label and icon submit button.",
    "compliance": {
      "nistControls": [],
      "rgaa": true,
      "wcag21AA": true,
      "webAccessibilityDirective": true,
      "piiHandling": "accepts_input",
      "auditTrailCompatible": true,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    }
  },
  "selection": {
    "useWhen": [
      "Global or section-level content search"
    ],
    "avoidWhen": [
      "Filtering within a single page — use tags or links"
    ]
  },
  "instruction": {
    "agentPrompt": "Set the form action. The visually-hidden label ('Rechercher') is mandatory. fr-search-bar--lg for hero placement.",
    "relatedComponents": [
      "table",
      "pagination"
    ]
  },
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],

      "costTier": "cheap",

      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "compositionRecipes": [
      "search-results"
    ]
  },
  "constraints": {
    "preserve": [
      "form with role='search' behaviour via .fr-search-bar",
      "Visually-hidden label on the input",
      "fr-btn with search icon as submit"
    ],
    "editable": [
      "Placeholder text",
      "Button label",
      "Size modifier"
    ],
    "limitations": [
      "The input needs an accessible name — keep the hidden label"
    ],
    "portableInvariants": [
      "Input associated with a label",
      "Submit button inside the form"

  },
  "supportedTokenProfiles": [
    "highContrast"

  "file": "search/default.html",
  "title": "Search bar (default)",
  "portability": {
    "classMapping": {
      "uswds": {
        "base": "usa-search"
      }
    }

<style>
body{font-family:'Marianne',Arial,Helvetica,sans-serif;font-size:1rem;line-height:1.5rem;color:#161616;padding:2rem;background:#fff;margin:0}
.cap{position:fixed;bottom:12px;left:16px;font-size:11px;letter-spacing:.08em;color:#666;text-transform:uppercase}
a{color:#000091}
:focus-visible{outline:2px solid #0a76f6;outline-offset:2px}
.govuk-visually-hidden,.fr-visually-hidden{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.fr-label{display:block;font-weight:500;font-size:.875rem;line-height:1.5rem;color:#161616}
.fr-hint-text{display:block;font-weight:400;font-size:.75rem;line-height:1.25rem;color:#666;margin-top:0}
.fr-error-text{display:block;font-weight:500;font-size:.75rem;line-height:1.5rem;color:#ce0500;margin-top:4px}
.fr-valid-text{display:block;font-weight:500;font-size:.75rem;line-height:1.5rem;color:#18753c;margin-top:4px}
.fr-text--lg{font-size:1.25rem;line-height:2rem}
.fr-text--sm,.fr-callout p{font-size:.875rem;line-height:1.5rem}

.fr-search-bar{display:flex;max-width:30rem}
.fr-search-bar label{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fr-search-bar .fr-input{border-radius:.25rem 0 0 0;border-right:0}
.fr-search-bar .fr-btn{border-radius:0 .25rem 0 0}

</style>
</head>
<body>
<form class="fr-search-bar" role="search" action="#" method="get">
  <label class="fr-label" for="search-example">Recherche</label>
  <input class="fr-input" type="search" id="search-example" name="q" placeholder="Rechercher">
  <button class="fr-btn" title="Rechercher">Rechercher</button>
</form>
<div class="cap">search default</div>
</body>
</html>
